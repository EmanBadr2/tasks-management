<div class="   ">

  <label for=""> {{label()}}</label>
  <div class="input-container relative   ">
    <input
  class="w-full  rounded border-0
    px-4 py-3.5   focus:ring-blue-600/50
  outline-none  ring-transparent focus:ring-2
  disabled:cursor-not-allowed   disabled:opacity-60
   "
  [type]="type()  === 'password' && this.passwordVisible() ? 'text' : type() "
   [formField]="field()"
   [placeholder]="placeholder()"

  >
  @if (hint()) {
   <div class="hint"> {{hint()}}</div>
  }





 @if (type() === 'password' && accessShowIcon() ) {
  <button
  class=" password-toggle icon-posision cursor-pointer top-50  absolute "
  type="button"
  (click)=" togglePasswordVisibility()"
  >
  @if(passwordVisible()){
    <!-- invisible icon -->
       <img src="../../../../assets/icons/Icon.svg" alt="">
  }
  @else {
    <!-- visible Icon -->
 <!-- <span> visible</span> -->
  <img src="../../../../assets/icons/Icon.svg" alt="">
  }

  <!-- <img src="../../../../assets/icons/Icon.svg"class="" alt="x" > -->
  </button>

 }



</div>
  </div>
