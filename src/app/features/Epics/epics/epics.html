

@if(epicState()==='error'){
  <app-error-state (retry)="getProjectEpics()"></app-error-state>
}

@if(epicState()==='loading'){
  <app-loading-state   ></app-loading-state>
}
@if(epicState()=== 'empty'){
  <app-empty-state   [feature]="'epic'" (addAction)="gotoNewEpic() "></app-empty-state>
}
@if(epicState()==='success'){
  <app-epics-list  [allProjectEpics]="allProjectEpics ()"> </app-epics-list>

}
