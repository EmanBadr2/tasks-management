<div class=" grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
@for (project of projectList(); track project.id ;  let i = $index) {

  <div class=" card flex flex-col gap-4 p-6 rounded-lg bg-white ">
    <!-- title & des.. -->
    <div class="item flex flex-col gap-2">
      <h3 class="text-medium text-color text-[18px] leading[24px]">{{project.name}} </h3>
      <span class=" text-regular text-[14px] leading-[22.75px] text-[#434654]">
       {{project.description}}
      </span>
      <!-- icons & navigate -->
      <div class="flex justify-between  pt-4">
        <!-- send id with it  -->
       <a routerLink="/MainLayout"> <img src="../../../../../assets/icons/test.svg" alt=""> </a>
         <a routerLink="/MainLayout"> <img src="../../../../../assets/icons/taskss.svg" alt=""> </a>
         <a routerLink="/MainLayout"> <img src="../../../../../assets/icons/memberss.svg" alt=""> </a>
      </div>
    </div>
    <!-- date -->
    <div class="create-date flex justify-between items-center
     pr-0 pt-4 border-t border-[#C3C6D61A] align-middle">
    <span class=" text-bold text-base   text-[#737685] uppercase"> CREATED AT</span>
    <span class=" text-medium text-[14px]  text-[#434654] "> {{project.created_at |date:'dd/MM/yyyy' }}</span>
    </div>
  </div>
    @if  (i === projectList().length - 1) {
     <div class=" card hidden md:flex  justify-center items-center h-[220px]
      p-6 rounded-lg bg-white border-2 border-dashed border-[#C3C6D633] ">
      <div class=" gap-4">
        <div class=" flex flex-col gap-4">
           <a routerLink="/MainLayout/AddEditProjects"
            class="m-auto"> <img src="../../../../../assets/icons/addP.svg"
             width="48px" alt=""> </a>
           <span class=" m-auto text-bold uppercase text-[14px] align-text text-[#434654]">ADD PROJECT</span>
        </div>

      </div>


   </div>

   }
}
