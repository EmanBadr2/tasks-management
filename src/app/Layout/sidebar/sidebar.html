<aside class="  flex flex-col justify-between  h-full  " >

  <!-- header -->
  <div class="sidebar-header flex px-2 gap-2 pb-8  items-center text-bold">
     <img src="../../../../Icon.svg" width="20" alt="">
    <span class=" "
    [class.hidden]="isCollapsed()"
    > TASKLY </span>
    </div>

    <!-- main Navigate -->
   <div class="saidbar-nav gap-1  flex-grow  ">

     <nav class=" flex flex-col gap-1  text-semibold ">
      <a
      routerLink="/MainLayout/Projects"
      routerLinkActive="active"
      class="flex gap-3 px-4 py-[10px] rounded-sm   items-center "
       [class.active]="isActive('/MainLayout/Projects')"
       >
          <img src="../../../../Icon.svg" width="20" alt="">
          <span
          class="  md:w-[224px] "
           [class.hidden]="isCollapsed()" > Project </span>
      </a>
        <a
       
        routerLink="/MainLayout/ProjectsList"

      class="flex gap-3 px-3 py-[10px]   "
        [class.active]="isActive('/MainLayout/ProjectsList')"
       >
          <img src="../../../../Icon.svg" width="20" alt="">
          <span
          class="  md:w-[224px] "
           [class.hidden]="isCollapsed()" > Statistics </span>
      </a>

      <!-- --------------- -->
       <!--Active projects -->
       <div class="active-projects flex flex-col gap-2.5  pt-3   ">
        <div class=" pt-4 border-t border-black/10 relative">

            <button
            (click)="toggleProjectMenu()"
            class=" flex gap-3 p-3
             rounded-t-[6px] bg-[#D7E2FF]
             w-full cursor-pointer   "
            >
            <img src="../../../../Icon.svg" width="20" alt="">
              <span
               class=" text-semibold "
                [class.hidden]="isCollapsed()"
               >Active Project Na...</span>
            <!-- <img src="../../../../SVG.png" alt="x"> -->
             <span  [class.hidden]="isCollapsed()"> 
              <img src="../../../../Icon.svg"  alt="">
            </span>
            </button>

            <!-- open in sidebar -->
            @if(!isCollapsed() && isMenuOpen() ){
              
              <div class="project-menu 
                  flex flex-col gap-1 p-2 rounded-b-[6px]   ">
                  @for (item of projectMenuItems; track item.label) {
                        <a
         class="item flex gap-3 px-4 py-[10px]  "
          [routerLink]="item.route"
          
           [class.active-project]="isActive(item.route)"
          
         >
           <img [src]="item.srcIcon" alt="x">
         <span class=" text-semibold "> {{item.label}}</span>
         </a>
                  }

              </div>
            }
            <!-- popup out sidebar -->
             @if(isCollapsed() && isMenuOpen() ){ 
              <div class="project-popup flex flex-col gap-1 
               p-2  rounded-r-lg
              ">
                @for (item of projectMenuItems; track item.label) {
                    <a
         class="item flex gap-3 px-4 py-[10px]  md:w-[230px] "
          [routerLink]="item.route"
           [class.active-project]="isActive(item.route)"
         >
           <img [src]="item.srcIcon" alt="">
           <span class=" text-semibold "> {{item.label}}</span>
         </a>
                }
              </div>
            }
           
<!-- 
        <div class="project-menu
         flex flex-col gap-1 p-2 rounded-b-[6px]   "
          [class.hidden]="!isMenuOpen()"
         >

         <a
         class="item flex gap-3 px-4 py-[10px]  active-project"
          routerLink="/MainLayout/"
         >
           icon
         <span class=" text-semibold "> Epics</span>
         </a>

         <a
         class="item flex gap-3 px-4 py-[10px]"
          routerLink="/MainLayout/"
         >
           icon
         <span class=" text-semibold "> Epics</span>
         </a>

         <a
         class="item flex gap-3 px-4 py-[10px]"
          routerLink="/MainLayout/"
         >
           icon
         <span class=" text-semibold "> Epics</span>
         </a>


      </div> -->

        </div>

       </div>

    </nav>




  </div>

<!-- collapse && logout -->
<div class="collapse-logout-container flex flex-col gap-1 pt-[24px]
text-medium  align-text

">

    <button
    type="button"
     class=" collapse-btn flex gap-3 py-[10px] px-3 cursor-pointer  "
     (click)="toggleCollapse()"
     >
     <img src="../../../../Icon.svg" width="20" alt="">
     <span
      [class.hidden]="isCollapsed()">collapes  </span>
      </button>

  <button
   type="button"
  (click)="logout()"
  class=" logout-btn flex gap-3 py-[10px] px-3 cursor-pointer"
  >
    <img src="../../../../Icon.svg"  width="20" alt="">
    <span
     [class.hidden]="isCollapsed()">  Logout </span>

   </button>

</div>

</aside>
